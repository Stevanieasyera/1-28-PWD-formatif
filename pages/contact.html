<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .contact-form {
            max-width: 400px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        .contact-form h2 {
            color: #333333;
            text-align: center;
        }

        .contact-form label {
            display: block;
            margin-top: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
        }

        .contact-form button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form class="contact-form">
        <h2>Hubungi Saya</h2>

        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Nama kamu">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email kamu">

        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="4" placeholder="Tulis pesan"></textarea>

        <button type="submit">Kirim</button>
    </form>
</body>
</html>
