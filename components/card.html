<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Card</title>

    <style>
        /* Perhitungan lebar card:
           320px termasuk padding dan border karena box-sizing: border-box. */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #cccccc;
            margin: 30px auto;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .card h3 {
            color: #333333;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
        }

        .card a {
            color: blue;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="../assets/photo.jpg" alt="Foto proyek">
        <h3>Proyek Saya</h3>
        <p>Ini adalah contoh proyek yang saya buat saat belajar HTML dan CSS.</p>
        <a href="#">Lihat proyek</a>
    </div>
</body>
</html>
