<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Badge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        .card {
            max-width: 320px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            border: 1px solid #dddddd;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .back-to-top {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #333333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-to-top:hover {
            background-color: #555555;
        }
    </style>
</head>
<body id="top">
    <div class="card">
        <span class="badge">Selesai</span>
        <h3>Proyek Saya</h3>
        <p>Contoh kartu proyek dengan badge status.</p>
    </div>

    <a class="back-to-top" href="#top">Kembali ke Atas</a>
</body>
</html>
